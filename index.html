<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#14532d">
<title>BerlaRoute – Minhas entregas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 52 52'%3E%3Crect width='52' height='52' rx='14' fill='%230f172a'/%3E%3Cpath d='M17 40V12h10a7 7 0 0 1 0 14H17h12a7 7 0 0 1 0 14H17' fill='none' stroke='%2322c55e' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='17' cy='40' r='4' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--bg:#f3f5f4;--card:#fff;--tx:#14201a;--mut:#5d6b64;--ac:#15803d;--ac2:#14532d;--bad:#b91c1c;--warn:#b45309;--ln:#dfe5e2}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
header{background:var(--ac2);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px}
header .lg{width:22px;height:22px}
header .sub{font-size:13px;opacity:.85;margin-top:2px}
.bar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#86efac;width:0}
main{padding:12px 12px 90px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:12px;margin-bottom:10px;border:1px solid var(--ln);overflow:hidden}
.head{display:flex;gap:10px;padding:12px;cursor:pointer;align-items:flex-start}
.seq{flex:0 0 32px;height:32px;border-radius:50%;background:var(--ac);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.card.ok .seq{background:#16a34a}.card.fail .seq{background:var(--bad)}
.info{flex:1;min-width:0}
.cli{font-weight:700}
.end{font-size:14px;color:var(--mut);margin-top:2px}
.meta{font-size:13px;margin-top:4px;color:var(--mut)}
.st{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.st.ok{background:#dcfce7;color:#166534}.st.fail{background:#fee2e2;color:var(--bad)}.st.pend{background:#eef2f0;color:var(--mut)}.st.chg{background:#fef3c7;color:var(--warn)}.st.env{background:#e0e7ff;color:#3730a3}
.body{display:none;padding:0 12px 14px;border-top:1px solid var(--ln)}
.card.open .body{display:block}
.links{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.links a{flex:1;text-align:center;padding:10px;border-radius:8px;background:#eef2f0;color:var(--tx);text-decoration:none;font-size:14px;font-weight:600}
.obsof{background:#fff7ed;border-left:3px solid var(--warn);padding:8px;font-size:14px;border-radius:4px;margin:8px 0}
div.foto{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;border:2px dashed var(--ln);border-radius:10px;padding:10px;margin:8px 0;font-weight:600}
div.foto.done{border-color:#16a34a;border-style:solid;background:#f0fdf4}
div.foto img{width:56px;height:56px;object-fit:cover;border-radius:6px;display:none;grid-row:span 2}
div.foto.done img{display:block}
div.foto .fnm{grid-column:auto}
div.foto:not(.done) .fnm,div.foto:not(.done) .fbt{grid-column:1/-1}
.fbt{display:flex;gap:8px}
.fb{flex:1;text-align:center;padding:12px 6px;border-radius:9px;background:#eef4f0;border:1px solid var(--ln);cursor:pointer;font-weight:700}
.fb.cam{background:#16a34a;color:#fff;border-color:#16a34a}
.fb input{display:none}
textarea,select{width:100%;font:inherit;padding:10px;border:1px solid var(--ln);border-radius:8px;margin:6px 0}
textarea{min-height:64px}
.btns{display:flex;gap:8px;margin-top:8px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:14px;cursor:pointer}
.b-ok{flex:2;background:#16a34a;color:#fff}.b-ok:disabled{background:#a7c7b2}
.b-fail{flex:1;background:#fff;color:var(--bad);border:2px solid var(--bad)}
.b-chg{width:100%;background:#fef3c7;color:var(--warn);margin-top:6px}
.b-fail2{width:100%;background:var(--bad);color:#fff;margin-top:6px}
.small{font-size:13px;color:var(--mut)}
.fail-box{display:none;background:#fef2f2;border-radius:8px;padding:10px;margin-top:8px}
.fail-box.on{display:block}
#toast{position:fixed;left:12px;right:12px;bottom:16px;background:#14201a;color:#fff;padding:14px;border-radius:10px;display:none;z-index:9;text-align:center}
#toast.bad{background:var(--bad)}
.msg{padding:30px 16px;text-align:center;color:var(--mut)}
.feito{font-size:14px;margin-top:8px;padding:8px;border-radius:8px;background:#f0fdf4}
.feito.fail{background:#fef2f2}
.gps{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.gps.on{border-color:#16a34a;background:#f0fdf4}.gps.fim{background:#f8fafc}
.gps .lin{display:flex;align-items:center;gap:10px}
.gps .dot{width:12px;height:12px;border-radius:50%;background:#16a34a;flex:0 0 12px;animation:pis 1.6s infinite}
.gps .dot.off{background:#f59e0b;animation:none}
@keyframes pis{0%{box-shadow:0 0 0 0 rgba(22,163,74,.6)}100%{box-shadow:0 0 0 12px rgba(22,163,74,0)}}
.b-ini{width:100%;background:#16a34a;color:#fff;font-size:18px}
.b-fim{width:100%;background:#fff;color:#14201a;border:2px solid #14201a;margin-top:10px}
</style>
</head>
<body>
<header><div style="display:flex;align-items:center;gap:8px;font-size:13px;opacity:.9;margin-bottom:6px"><svg class="lg" viewBox="0 0 52 52" aria-hidden="true"><rect width="52" height="52" rx="14" fill="#fff"/><path d="M17 40V12h10a7 7 0 0 1 0 14H17h12a7 7 0 0 1 0 14H17" fill="none" stroke="#14532d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17" cy="40" r="3.5" fill="#f59e0b"/><circle cx="29" cy="40" r="3.5" fill="#14532d"/></svg><span>Berla<b>Route</b></span></div><h1 id="t">Carregando…</h1><div class="sub" id="s"></div><div class="bar"><i id="pg"></i></div></header>
<main id="m"><div class="msg">Carregando suas entregas…</div></main>
<div id="toast"></div>
<script>
"use strict";
var CFG={url:'https://nuicnpxpuhlbmfrmdirf.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51aWNucHhwdWhsYm1mcm1kaXJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NTA5MjEsImV4cCI6MjEwNzAyNjkyMX0.epWBD3u8JwjRWllQFJovBO5d4WX42xzXTKsnb9HnJwc'};
var QS=new URLSearchParams(location.search);var TOKEN=QS.get('r')||'';var SOLO=QS.get('p')||'';var verTodas=!SOLO;var ACAO=QS.get('a')||'';
var gpsW=null,gpsUlt=0,gpsPos=null,gpsErro='',wake=null,gpsOcup=false;
var rota=null,estado={},fotos={},fila=[],enviando=false,aberto=null;
var MOTIVOS=['Cliente ausente / local fechado','Endereço não encontrado','Recusado pelo cliente','Sem acesso / portaria não liberou','Atraso – cliente não aceitou','Outro (descreva)'];
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t,bad){var e=$('#toast');e.textContent=t;e.className=bad?'bad':'';e.style.display='block';clearTimeout(toast.k);toast.k=setTimeout(function(){e.style.display='none'},4500)}
function hora(iso){var d=new Date(iso);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function rpc(fn,body){return fetch(CFG.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':CFG.key,'Authorization':'Bearer '+CFG.key,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null}catch(e){}if(!r.ok)throw new Error((j&&(j.message||j.hint))||('erro '+r.status));return j})})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function salvarLocal(){try{localStorage.setItem('kle_m_'+TOKEN,JSON.stringify({estado:estado}))}catch(e){}}
function carregar(){
 if(!TOKEN){$('#m').innerHTML='<div class="msg">Link inválido. Peça o link da rota de novo.</div>';$('#t').textContent='BerlaRoute';return}
 rpc('get_rota',{p_id:TOKEN}).then(function(r){
  if(!r){$('#m').innerHTML='<div class="msg">Rota não encontrada ou expirada. Fale com a logística.</div>';$('#t').textContent='BerlaRoute';return}
  rota=r;estado={};
  aplicarBaixas(r.baixas);
  render();ligarGps();if(rota.inicio&&!rota.fim)lerPos().then(function(){enviarPos(true)});executarAcao();carregarFilaSalva();
 }).catch(function(e){$('#m').innerHTML='<div class="msg">Sem conexão para carregar a rota.<br><br><button class="b-ok" onclick="carregar()">Tentar de novo</button></div>'});
}
function render(){
 var d=rota.data.split('-');$('#t').textContent='Entregas de '+d[2]+'/'+d[1];
 $('#s').textContent=(rota.motorista||'')+(rota.veiculo?' · '+rota.veiculo:'');
 var P=rota.paradas||[],feitas=P.filter(function(p){var e=estado[p.id];return e&&(e.status==='entregue'||e.status==='fracassada')}).length;
 $('#pg').style.width=(P.length?100*feitas/P.length:0)+'%';
 $('#s').textContent+=' · '+feitas+'/'+P.length+' concluídas';
 var ids=P.map(function(p){return p.id});if(SOLO&&ids.indexOf(SOLO)<0)verTodas=true;
 if(SOLO&&!verTodas&&aberto===null&&!(estado[SOLO]&&estado[SOLO].status))aberto=SOLO;
 var soloIdx=ids.indexOf(SOLO),prox=null;if(SOLO&&!verTodas){for(var k=soloIdx+1;k<P.length;k++){var ek=estado[P[k].id];if(!(ek&&(ek.status==='entregue'||ek.status==='fracassada'))){prox=P[k];break}}}
 $('#m').innerHTML=htmlGps(P.length-feitas)+(SOLO&&!verTodas?'<p class="small" style="margin:0 0 8px">Entrega '+(soloIdx+1)+' de '+P.length+'</p>':'')+P.map(function(p,i){
  if(SOLO&&!verTodas&&p.id!==SOLO)return '';
  var e=estado[p.id]||{},f=fotos[p.id]||{};
  var cls=e.status==='entregue'?'ok':e.status==='fracassada'?'fail':'';
  var st=e.pendente?'<span class="st env">enviando…</span>':e.status==='entregue'?'<span class="st ok">Entregue '+hora(e.quando)+'</span>':e.status==='fracassada'?'<span class="st fail">Fracassada</span>':e.chegada?'<span class="st chg">No local</span>':'<span class="st pend">Pendente</span>';
  if(e.status==='entregue'&&!e.pendente&&!['caixas','os'].every(function(t){return (e.fotosOk||{})[t]}))st='<div style="text-align:right">'+st+'<div class="st chg" style="margin-top:4px;display:inline-block">📷 falta foto</div></div>';
  var q=encodeURIComponent(p.endereco||'');var ll=p.lat!=null?(p.lat+','+p.lng):q;
  var corpo='';var fok=e.fotosOk||{};
  var fq=fila.filter(function(it){return it.parada===p.id}).reduce(function(a,it){return a+it.fotos.filter(function(x){return !x.subiu}).length},0);
  var falta=['caixas','os'].filter(function(t){return !fok[t]});
  if(e.status&&!e.pendente){corpo='<div class="feito'+(e.status==='fracassada'?' fail':'')+'">'+(e.status==='entregue'?'✅ Baixa enviada às '+hora(e.quando):'❌ Fracassada às '+hora(e.quando))+(e.obs?'<br><span class="small">'+esc(e.obs)+'</span>':'')+'</div>'+
   (e.status==='entregue'&&falta.length?'<div class="obsof"><b>Faltam fotos:</b> '+falta.map(nomeFoto).join(' e ')+'. Toque em 📸 Câmera ou 🖼️ Galeria — a foto é enviada sozinha.</div>'+falta.map(function(t){return seletorFoto(p.id,t,f,fok)}).join('')+(falta.some(function(t){return f[t]})?'<button class="b-ok" style="width:100%" data-envfoto="'+p.id+'">📤 Enviar foto(s)</button>':''):'')+
   (fq?'<p class="small">📤 '+fq+' foto(s) salvas no celular, enviando…'+(ultimoErro?'<br><span style="color:#b45309">Última tentativa: '+esc(ultimoErro)+' — tento de novo sozinho.</span>':'')+'</p>':'')+(fotoErro[p.id]?'<p class="small" style="color:#b91c1c;font-weight:600">⚠ '+esc(fotoErro[p.id])+'</p>':'')+
   '<button class="b-chg" data-refazer="'+p.id+'">Corrigir esta baixa</button>'}
  else if(e.pendente){corpo='<div class="feito">⏳ Baixa salva no celular'+(e.quando?' às '+hora(e.quando):'')+'. Ela é enviada sozinha assim que tiver sinal — pode seguir para a próxima entrega.</div>'}
  else{
   corpo=(e.chegada?'<p class="small">📍 Chegada registrada às '+hora(e.chegada)+'</p>':'<button class="b-chg" data-chg="'+p.id+'">📍 Cheguei no local</button>')+
   '<div class="btns"><button class="b-ok" data-ok="'+p.id+'">✅ Entregue</button><button class="b-fail" data-fx="'+p.id+'">❌ Fracassada</button></div>'+
   '<p class="small" style="margin:8px 0 2px"><b>Fotos</b> (caixas e OS assinada) — tire agora ou envie depois. A baixa não depende delas.</p>'+
   seletorFoto(p.id,'caixas',f,fok)+seletorFoto(p.id,'os',f,fok)+
   '<textarea placeholder="Observação (opcional): quem recebeu, ocorrência…" data-obs="'+p.id+'">'+esc(f.obs||'')+'</textarea>'+
   '<div class="fail-box'+(f.fx?' on':'')+'"><b>Entrega fracassada</b><select data-motivo="'+p.id+'"><option value="">Selecione o motivo…</option>'+MOTIVOS.map(function(m){return '<option'+(f.motivo===m?' selected':'')+'>'+esc(m)+'</option>'}).join('')+'</select><p class="small">Escreva o detalhe na observação acima. Foto é opcional (fachada fechada, por exemplo).</p><button class="b-fail2" data-fail="'+p.id+'">Confirmar entrega fracassada</button></div>';
  }
  return '<div class="card '+cls+(aberto===p.id?' open':'')+'" id="c_'+p.id+'"><div class="head" data-tg="'+p.id+'"><div class="seq">'+(i+1)+'</div><div class="info"><div class="cli">'+esc(p.cliente)+'</div><div class="end">'+esc(p.endereco)+'</div><div class="meta">'+(p.previsto?'Previsão '+esc(p.previsto)+' · ':'')+'Janela '+esc(p.janela||'—')+(p.caixas?' · '+esc(p.caixas)+' cx':'')+(p.os?' · OS '+esc(p.os):'')+'</div></div>'+st+'</div>'+
  '<div class="body"><div class="links"><a href="https://www.google.com/maps/dir/?api=1&destination='+ll+'" target="_blank" rel="noopener">🗺️ Maps</a><a href="https://waze.com/ul?'+(p.lat!=null?'ll='+ll+'&navigate=yes':'q='+q)+'" target="_blank" rel="noopener">🚗 Waze</a>'+(p.tel?'<a href="tel:'+esc(String(p.tel).replace(/[^0-9+]/g,''))+'">📞 Ligar</a>':'')+'</div>'+(p.obs?'<div class="obsof">'+esc(p.obs)+'</div>':'')+corpo+'</div></div>';
 }).join('')+(SOLO&&!verTodas?((estado[SOLO]&&estado[SOLO].status&&!estado[SOLO].pendente)?'<div class="feito" style="text-align:center">Pronto! '+(prox?'Volte ao WhatsApp e toque no link da próxima entrega: <b>'+esc(prox.cliente)+'</b>.':'Esta era a última entrega da rota. Obrigado!')+'</div>':'')+'<button class="b-chg" data-todas="1" style="background:#eef2f0;color:#14201a">Ver todas as entregas da rota</button>':'')+'<p class="small" style="text-align:center">BerlaRoute · em caso de dúvida fale com a logística</p>';
}
function hm(ms){var m=Math.round(ms/60000);return Math.floor(m/60)+'h'+('0'+m%60).slice(-2)}
function htmlGps(pend){
 if(!rota)return '';
 if(rota.fim)return '<div class="gps fim"><b>🏁 Roteiro encerrado</b><div class="small">Início '+hora(rota.inicio)+' · término '+hora(rota.fim)+' · '+hm(new Date(rota.fim)-new Date(rota.inicio))+'</div></div>';
 if(!rota.inicio)return '<div class="gps"><button class="b-ini" data-ini="1"'+(gpsOcup?' disabled':'')+'>▶ Iniciar roteiro</button><p class="small" style="margin:8px 0 0">Ao iniciar, sua localização é compartilhada com a logística <b>somente até você encerrar o roteiro</b>. Deixe esta página aberta sempre que possível.</p>'+(gpsErro?'<div class="obsof" style="margin-top:10px"><b>Para liberar a localização:</b><br>1) Feche balões e sobreposições (gravador de tela, bolha do Messenger/WhatsApp, filtro de luz azul).<br>2) Toque no ícone <b>⚙</b> à esquerda do endereço do site › <b>Permissões</b> › <b>Localização</b> › <b>Permitir</b>.<br>3) Confira se o GPS do celular está ligado.<br>4) Toque de novo em <b>▶ Iniciar roteiro</b>.</div>':'')+'</div>';
 var ok=gpsW!==null&&!gpsErro;
 return '<div class="gps on"><div class="lin"><span class="dot'+(ok?'':' off')+'"></span><div><b>Roteiro em andamento</b> desde '+hora(rota.inicio)+'<div class="small">'+(gpsErro?esc(gpsErro):ok?'GPS ativo'+(gpsUlt?' · enviado às '+hora(new Date(gpsUlt).toISOString()):''):'GPS pausado — toque aqui na página para retomar')+'</div></div></div><button class="b-fim" data-encerrar="'+pend+'"'+(gpsOcup?' disabled':'')+'>■ Encerrar roteiro</button></div>';
}
function pendentes(){var P=(rota&&rota.paradas)||[];return P.filter(function(p){var e=estado[p.id];return !(e&&!e.pendente&&(e.status==='entregue'||e.status==='fracassada'))}).length}
function verificarFim(){if(!rota||!rota.inicio||rota.fim||!(rota.paradas||[]).length||fila.length)return;if(pendentes()>0)return;if(gpsOcup){setTimeout(verificarFim,3000);return}encerrarRoteiro('auto')}
function executarAcao(){if(!ACAO||!rota)return;var a=ACAO;ACAO='';try{var u=new URL(location.href);u.searchParams.delete('a');history.replaceState(null,'',u.toString())}catch(e){}
 if(a==='ini'){if(rota.fim)toast('Este roteiro já foi finalizado às '+hora(rota.fim));else if(rota.inicio)toast('Roteiro já iniciado às '+hora(rota.inicio)+' — GPS ativo');else iniciarRoteiro(false)}
 else if(a==='fim'){if(rota.fim)toast('Roteiro já finalizado às '+hora(rota.fim));else if(!rota.inicio)toast('O roteiro ainda não foi iniciado',true);else encerrarRoteiro(pendentes())}}
function lerPos(){return new Promise(function(ok){if(!navigator.geolocation)return ok(null);var t=setTimeout(function(){ok(gpsPos)},8000);navigator.geolocation.getCurrentPosition(function(p){clearTimeout(t);gpsPos={lat:p.coords.latitude,lng:p.coords.longitude,prec:Math.round(p.coords.accuracy)};gpsErro='';ok(gpsPos)},function(e){clearTimeout(t);if(e&&e.code===1)gpsErro='Localização bloqueada: libere a localização para este site nas configurações do celular.';ok(null)},{enableHighAccuracy:true,timeout:8000,maximumAge:30000})})}
function enviarPos(forcar){if(!gpsPos||!rota||!rota.inicio||rota.fim)return;var ag=Date.now();if(!forcar&&ag-gpsUlt<30000)return;gpsUlt=ag;
 rpc('posicao_rota',{p_id:TOKEN,p_lat:gpsPos.lat,p_lng:gpsPos.lng,p_prec:gpsPos.prec}).then(function(){var g=document.querySelector('.gps .small');if(g&&!gpsErro)g.textContent='GPS ativo · enviado às '+hora(new Date().toISOString())}).catch(function(){gpsUlt=0})}
function ligarGps(){
 if(!rota||!rota.inicio||rota.fim||gpsW!==null||!navigator.geolocation)return;
 gpsW=navigator.geolocation.watchPosition(function(p){gpsPos={lat:p.coords.latitude,lng:p.coords.longitude,prec:Math.round(p.coords.accuracy)};var era=gpsErro;gpsErro='';if(era)render();enviarPos(false)},function(e){if(e&&e.code===1){gpsErro='Localização bloqueada: libere a localização para este site nas configurações do celular.';desligarGps();render()}},{enableHighAccuracy:true,maximumAge:15000,timeout:30000});
 try{if(navigator.wakeLock&&document.visibilityState==='visible')navigator.wakeLock.request('screen').then(function(w){wake=w}).catch(function(){})}catch(e){}
}
function desligarGps(){if(gpsW!==null){try{navigator.geolocation.clearWatch(gpsW)}catch(e){}gpsW=null}try{if(wake){wake.release();wake=null}}catch(e){}}
function iniciarRoteiro(auto){if(gpsOcup||!rota||rota.inicio)return;gpsOcup=true;render();lerPos().then(function(p){
 if(!p&&gpsErro){gpsOcup=false;render();toast(gpsErro,true);return}
 return rpc('iniciar_rota',{p_id:TOKEN,p_lat:p?p.lat:null,p_lng:p?p.lng:null,p_prec:p?p.prec:null}).then(function(r){rota.inicio=r.inicio;rota.fim=null;gpsUlt=Date.now();gpsOcup=false;ligarGps();render();toast(auto?'▶ Roteiro iniciado automaticamente às '+hora(r.inicio):'▶ Roteiro iniciado às '+hora(r.inicio)+'. Boa rota!');verificarFim()})

function lerImagem(file,M){M=M||1600;

function tipoArq(file,cab){var t=(file.type||'').toLowerCase();if(t)return t;var n=(file.name||'').toLowerCase();

function reduzir(file){

  return new Promise(function(ok,er){c.toBlob(function(b){b&&b.size>1000?ok(b):er(new Error('foto'))},'image/jpeg',0.65)})}).catch(function(e){

  x.erro=String(e&&e.message||e);x.recusada=!!(e&&e.recusada)})}
